name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.34.5"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CI configuration
        run: pnpm test:ci-config

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build gateway
        run: pnpm build:gateway

      - name: Validate internal-test content
        run: pnpm validate:content:internal

      - name: Check Expo dependencies
        run: pnpm --filter @cave/mobile expo:doctor

      - name: Export production iOS JavaScript
        run: pnpm --filter @cave/mobile export:ios

      - name: Scan exported mobile bundle
        run: pnpm security:scan-bundle

      - name: Audit production dependencies
        run: pnpm security:audit
