name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never interrupt a main deployment or database migration with a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore pnpm bootstrap downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cave-npm-bootstrap/_cacache
          key: npm-bootstrap-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml', '.nvmrc') }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        # Only suppress npm's redundant audit while installing the tool itself.
        # The mandatory project security:audit below still queries fresh advisories.
        env:
          npm_config_cache: ${{ runner.temp }}/cave-npm-bootstrap
          npm_config_prefer_offline: "true"
          npm_config_audit: "false"
          npm_config_fund: "false"
        with:
          version: "10.34.5"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify internal device readiness
        run: pnpm verify:internal

      - name: Verify staging deployment configuration
        run: pnpm --filter @cave/gateway build:staging

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: internal-verification
          path: outputs/p0-readiness/verification.*

  deploy-staging:
    needs: foundation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gateway-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging-api.neijiecave.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: "10.34.5"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse an obsolete queued deployment
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
      - name: Publish staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/gateway-release.mjs deploy staging
      - name: Preserve staging deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-release-${{ github.sha }}
          path: outputs/gateway-release/*.json
          retention-days: 90
