appId: com.neijie.cave
name: Back edit, branch history, and delete one review
tags:
  - release-static-spec
---
# Prerequisite: run core-flow, then sign in to a dedicated synthetic test account.
# Keep that signed-in state and a recent completed local journey; do not clear state here.
- launchApp
- tapOn: "我的"
- assertVisible: "旅程"
- assertVisible: "内界手记"
- assertVisible: "AI"
- assertVisible: "我的"
- scrollUntilVisible:
    element:
      text: "打开关键事件与阶段回顾"
    direction: DOWN
- tapOn: "打开关键事件与阶段回顾"
- assertVisible: "回顾区间.*"
- scrollUntilVisible:
    element:
      text: "完成旅程回顾.*"
    direction: DOWN
- tapOn:
    text: "完成旅程回顾.*"
    index: 0
- scrollUntilVisible:
    element:
      text: "从这条回顾开始新分支"
    direction: DOWN
- tapOn: "从这条回顾开始新分支"

- assertVisible: "5 / 5"
- tapOn: "返回上一步"
- assertVisible: "4 / 5"
- assertVisible: "你随时可以改变主意"
- tapOn: "返回上一步"
- assertVisible: "3 / 5"
- scrollUntilVisible:
    element:
      text: "继续整理感受"
    direction: DOWN
- tapOn: "继续整理感受"
- assertVisible: "4 / 5"
- scrollUntilVisible:
    element:
      text: "我知道了，继续整理沟通草稿"
    direction: DOWN
- tapOn: "我知道了，继续整理沟通草稿"
- assertVisible: "5 / 5"
- scrollUntilVisible:
    element:
      text: "保存并查看我的沟通草稿"
    direction: DOWN
- tapOn: "保存并查看我的沟通草稿"
- assertVisible: "沟通草稿已保存"
- tapOn: "暂时不用，完成旅程"

- extendedWaitUntil:
    visible: "旅程"
    timeout: 20000
- tapOn: "我的"
- scrollUntilVisible:
    element:
      text: "打开关键事件与阶段回顾"
    direction: DOWN
- tapOn: "打开关键事件与阶段回顾"
- assertVisible: "回顾区间.*"
- scrollUntilVisible:
    element:
      text: "完成旅程回顾.*"
    direction: DOWN
- tapOn:
    text: "完成旅程回顾.*"
    index: 0
- scrollUntilVisible:
    element:
      text: "删除这条回顾"
    direction: DOWN
- tapOn: "删除这条回顾"
- assertVisible: "请再次确认：这条回顾会从本机删除，并且无法恢复。"
- tapOn: "确认删除这条回顾"
- assertVisible: "这条回顾已删除。"
- tapOn: "返回我的回顾"
- assertVisible: "我的"
- scrollUntilVisible:
    element:
      text: "打开关键事件与阶段回顾"
    direction: DOWN
- assertVisible: "打开关键事件与阶段回顾"
