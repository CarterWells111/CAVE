appId: com.neijie.cave
name: Back edit, branch history, and delete one review
tags:
  - release-static-spec
---
- runFlow: core-flow.yaml
- tapOn: "回顾"
- assertVisible: "首页"
- assertVisible: "回顾"
- assertVisible: "练习"
- assertVisible: "我的"
- tapOn:
    text: "打开回顾：.*"
    index: 0
- assertVisible: "从这条回顾开始新分支"
- tapOn: "从这条回顾开始新分支"

- assertVisible: "5 / 5"
- tapOn: "返回上一页"
- assertVisible: "4 / 5"
- assertVisible: "你随时可以改变主意"
- tapOn: "返回上一页"
- assertVisible: "3 / 5"
- scrollUntilVisible:
    element:
      text: "继续整理感受"
    direction: DOWN
- tapOn: "继续整理感受"
- assertVisible: "4 / 5"
- scrollUntilVisible:
    element:
      text: "我知道了，继续整理沟通草稿"
    direction: DOWN
- tapOn: "我知道了，继续整理沟通草稿"
- assertVisible: "5 / 5"
- scrollUntilVisible:
    element:
      text: "保存并查看我的沟通草稿"
    direction: DOWN
- tapOn: "保存并查看我的沟通草稿"
- assertVisible: "沟通草稿已保存"
- tapOn: "暂时不用，完成旅程"

- extendedWaitUntil:
    visible: "首页"
    timeout: 20000
- tapOn: "回顾"
- tapOn:
    text: "打开.*"
    index: 0
- tapOn: "删除这条回顾"
- assertVisible: "请再次确认：这条回顾会从本机删除，并且无法恢复。"
- tapOn: "确认删除这条回顾"
- assertVisible: "这条回顾已删除。"
- tapOn: "返回回顾历史"
- assertVisible: "历史回顾"
