appId: com.neijie.cave
name: Five-page core flow, optional practice handoff, and main shell
tags:
  - release-static-spec
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "欢迎来到内界 CAVE"
    timeout: 20000
- assertNotVisible: "1 / 5"
- tapOn: "我已满 18 岁，开始探索"
- tapOn: "你｜日常、自然，不限定性别。"
- tapOn: "这样称呼我"
- tapOn: "先跳过"

- assertVisible: "1 / 5"
- assertVisible: "身体与安全知识"
- scrollUntilVisible:
    element:
      text: "看看我对过夜的期待"
    direction: DOWN
- tapOn: "看看我对过夜的期待"

- assertVisible: "2 / 5"
- assertVisible: "过夜期待与在意"
- tapOn: "继续看看我的在意"
- scrollUntilVisible:
    element:
      text: "带着这些感受继续"
    direction: DOWN
- tapOn: "带着这些感受继续"

- assertVisible: "3 / 5"
- assertVisible: "行为地图与边界"
- repeat:
    times: 7
    commands:
      - tapOn: "暂时不回答"
      - tapOn: "记录这个感受，继续"
- tapOn: "这次不查看"
- tapOn: "这次没有"

- assertVisible: "4 / 5"
- assertVisible: "你随时可以改变主意"
- assertVisible: "这是你此刻的感受，不是你必须履行的承诺。"
- scrollUntilVisible:
    element:
      text: "我知道了，继续整理沟通草稿"
    direction: DOWN
- tapOn: "我知道了，继续整理沟通草稿"

- assertVisible: "5 / 5"
- assertVisible: "我的沟通草稿"
- scrollUntilVisible:
    element:
      text: "保存并查看我的沟通草稿"
    direction: DOWN
- tapOn: "保存并查看我的沟通草稿"

- assertVisible: "沟通草稿已保存"
- assertVisible: "先停一下，我现在不想继续。"
- assertVisible: "排练一下这句话"
- tapOn: "排练一下这句话"

- extendedWaitUntil:
    visible: "来自刚完成的旅程"
    timeout: 20000
- assertVisible: "用这句话排练"
- assertVisible: "先停一下，我现在不想继续。"
- tapOn: "用这句话排练"
- assertVisible: "预设沟通练习"
- tapOn: "开始情境练习"
- assertVisible: "先停一下，我现在不想继续。"
- back
- assertVisible: "来自刚完成的旅程"
- assertVisible: "首页"
- assertVisible: "练习"
- assertVisible: "我的"
- assertNotVisible: "设置.*当前"
