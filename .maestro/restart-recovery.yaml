appId: com.neijie.cave
name: Journey restoration after process restart
tags:
  - pending-device
---
# Prerequisite: run core-flow, then sign in to a dedicated synthetic test account.
# Keep that signed-in state and a recent completed local journey; do not clear state here.
- launchApp
- stopApp
- launchApp
- tapOn: "我的"
- scrollUntilVisible:
    element:
      text: "打开关键事件与阶段回顾"
    direction: DOWN
- tapOn: "打开关键事件与阶段回顾"
- assertVisible: "回顾区间.*"
- scrollUntilVisible:
    element:
      text: "完成旅程回顾.*"
    direction: DOWN
- tapOn:
    text: "完成旅程回顾.*"
    index: 0
- scrollUntilVisible:
    element:
      text: "从这条回顾开始新分支"
    direction: DOWN
- assertVisible: "从这条回顾开始新分支"
